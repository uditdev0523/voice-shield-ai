version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: voiceshield_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - DEBUG=false
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
      - ENABLE_AUDIO_RETENTION=false
      - MODEL_DEVICE=cpu
      - MODEL_CHECKPOINT_PATH=backend/data/models/voiceshield_best.pt
    volumes:
      - voiceshield_audit_data:/app/backend/data/audit
      - ./backend/data/models:/app/backend/data/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - voiceshield_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: voiceshield_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - voiceshield_network

volumes:
  voiceshield_audit_data:
    driver: local

networks:
  voiceshield_network:
    driver: bridge
